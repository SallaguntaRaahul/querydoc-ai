[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "querydoc-ai"
version = "0.1.0"
description = "QueryDoc AI backend — FastAPI service and local PDF RAG engine"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Raahul Sallagunta" }]
dependencies = [
    "pymupdf>=1.24",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "sentence-transformers>=3.0",
    "transformers>=4.45",
    "torch>=2.3",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "psutil>=5.9",
    "rank-bm25>=0.2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "matplotlib>=3.8"]
ocr = ["pytesseract>=0.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "querydoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: needs model downloads or long runtime",
    "llm: needs the local generation model",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["querydoc", "app"]

[[tool.mypy.overrides]]
# SWIG/auto-generated stubs for these libraries are inaccurate; treat them as untyped.
module = ["faiss", "faiss.*", "pymupdf", "pymupdf.*", "transformers", "transformers.*"]
follow_imports = "skip"
