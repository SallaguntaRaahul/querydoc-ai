name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      QUERYDOC_SKIP_LLM: "1"   # the 3 GB generation model is not downloaded in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('backend/pyproject.toml') }}
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - run: ruff check app querydoc tests
      - run: mypy
      - name: Tests (engine + API; LLM e2e skipped)
        run: pytest -m "not llm" --timeout=900
        env:
          # Shared 4-vCPU runner measured 360 ms p95 (vs 175-244 ms on the target Mac);
          # 600 ms keeps the latency test as a regression guard here.
          QUERYDOC_LATENCY_BUDGET_MS: "600"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx vitest run
      - run: npm run build
# Playwright end-to-end tests need the local models and a GPU-capable machine for
# realistic timing; run them locally with ./scripts/test_all.sh.
